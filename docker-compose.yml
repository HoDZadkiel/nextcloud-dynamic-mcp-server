services:
  mcp:
    container_name: nextcloud-live-instance-mcp
    build: .
    ports:
      - "8000:8000"
    environment:
      NEXTCLOUD_URL: "https://nextcloud.example.com"   # or http://host.docker.internal:8080 for local dev
      NEXTCLOUD_USERNAME: "your-username"
      NEXTCLOUD_APP_TOKEN: "your-app-token"
      # CORS_ALLOW_ORIGINS: "https://your-browser-mcp-client.example.com"
    networks:
      - testnet

networks:
  testnet:
    external: true
